<style>
/* ── Tokens ─────────────────────────────────────────────────────────────── */
:root{
  --hangar:#101A2B; --rack:#18263D; --rack-hi:#1F3050; --rule:#2C3E5C;
  --chalk:#E8EDF5; --dim:#8296B3;
  --signal:#FFB020; --verified:#4ED2A0; --fault:#FF5C5C; --urgent:#FF8A3D;

  --display:'Saira Condensed',Impact,sans-serif;
  --body:'IBM Plex Sans',system-ui,sans-serif;
  --data:'IBM Plex Mono',ui-monospace,monospace;

  --fs-label:11px; --fs-data:13px; --fs-body:15px; --fs-strip:22px; --fs-board:34px;
  --pad:32px;
}
html.big{ --fs-label:13px; --fs-data:16px; --fs-body:18px; --fs-strip:27px; --fs-board:42px; }

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--hangar); color:var(--chalk);
  font-family:var(--body); font-size:var(--fs-body);
  -webkit-font-smoothing:antialiased;
}

/* ── Frame ──────────────────────────────────────────────────────────────── */
#board{
  height:100vh; display:grid;
  grid-template-rows:auto auto 1fr auto;
  padding:var(--pad); gap:0;
}

/* Rail */
.rail{display:flex;align-items:baseline;gap:16px;padding-bottom:14px}
.mark{
  font-family:var(--display);font-weight:700;font-size:var(--fs-board);
  letter-spacing:.05em;text-transform:uppercase;line-height:1;
}
.mark em{font-style:normal;color:var(--signal)}
.mission{
  font-family:var(--body);font-size:var(--fs-data);color:var(--dim);
  flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.clock{font-family:var(--data);font-size:var(--fs-strip);font-variant-numeric:tabular-nums}
.live{
  font-family:var(--display);font-weight:600;font-size:var(--fs-label);
  letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  display:flex;align-items:center;gap:8px;
}
.live .dot{width:9px;height:9px;border-radius:50%;background:var(--dim)}
.live[data-mode="live"] .dot{background:var(--signal);box-shadow:0 0 12px var(--signal)}
.live[data-mode="live"]{color:var(--signal)}
.live[data-mode="idle"] .dot{background:var(--signal);animation:breathe 2.4s ease-in-out infinite}
.live[data-mode="replay"] .dot{background:var(--verified)}
.live[data-mode="replay"]{color:var(--verified)}

/* Counters */
.counters{
  display:flex;gap:26px;padding:10px 0 16px;border-top:1px solid var(--rule);
  border-bottom:1px solid var(--rule);margin-bottom:18px;
}
.counter{display:flex;align-items:baseline;gap:7px}
.counter b{
  font-family:var(--data);font-weight:600;font-size:var(--fs-data);
  font-variant-numeric:tabular-nums;color:var(--chalk);
}
.counter span{
  font-family:var(--display);font-weight:600;font-size:var(--fs-label);
  letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
}
.counter.hot b{color:var(--signal)}

/* Panes */
.panes{display:grid;grid-template-columns:60fr 40fr;gap:24px;min-height:0}
.pane{display:flex;flex-direction:column;min-height:0;position:relative}
.pane h2{
  font-family:var(--display);font-weight:600;font-size:var(--fs-label);
  letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  padding-bottom:10px;
}
.scroll{overflow-y:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
.scroll::-webkit-scrollbar{width:6px}
.scroll::-webkit-scrollbar-thumb{background:var(--rule)}

/* ── Strip ──────────────────────────────────────────────────────────────── */
.strip{
  position:relative;display:flex;align-items:center;gap:16px;
  height:56px;padding:0 16px 0 19px;margin-bottom:6px;
  background:var(--rack);border-left:3px solid var(--dim);
}
.strip.child{margin-left:28px}
.strip.child::before{
  content:"";position:absolute;left:-20px;top:-9px;width:14px;height:31px;
  border-left:1px solid var(--rule);border-bottom:1px solid var(--rule);
}
.strip .id{
  font-family:var(--data);font-size:var(--fs-label);color:var(--dim);
  width:46px;flex:none;
}
.strip .label{
  font-family:var(--display);font-weight:600;font-size:var(--fs-strip);
  letter-spacing:.03em;text-transform:uppercase;
  flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.strip .state{
  font-family:var(--display);font-weight:600;font-size:var(--fs-label);
  letter-spacing:.14em;text-transform:uppercase;width:82px;flex:none;text-align:right;
}
.strip .meta{
  font-family:var(--data);font-size:var(--fs-label);color:var(--dim);
  width:96px;flex:none;text-align:right;font-variant-numeric:tabular-nums;
}
/* agent.retry carries budget_remaining and 05 Beat 3 says to narrate the cap "even
   though it's on screen". This is what puts it there. An unbounded loop on stage is a
   demo that never ends; a visible decrementing budget is the difference. */
.strip .budget{
  font-family:var(--display);font-weight:600;font-size:var(--fs-label);
  letter-spacing:.12em;text-transform:uppercase;color:var(--signal);
  flex:none;white-space:nowrap;
}
.strip .budget:empty{display:none}
/* The status note: what this agent is doing right now, in its own words. */
.strip .note{
  font-family:var(--data);font-size:var(--fs-label);color:var(--dim);opacity:.75;
  flex:none;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
/* Convergence: agents that independently cited the same evidence. Amber, because this is
   signal, not status — it is the swarm agreeing with itself across isolated contexts. */
.strip .conv{
  font-family:var(--data);font-size:var(--fs-label);color:var(--signal);
  flex:none;white-space:nowrap;letter-spacing:.04em;
}
.strip .note:empty,.strip .conv:empty{display:none}
.strip[data-state="ok"] .note{display:none}
.trace{display:flex;align-items:flex-end;gap:2px;height:26px;width:150px;flex:none}
.trace i{width:3px;background:var(--dim);opacity:.35;display:block}

.strip[data-state="thinking"],.strip[data-state="working"],.strip[data-state="spawning"]{border-left-color:var(--signal)}
.strip[data-state="thinking"] .state,.strip[data-state="working"] .state,.strip[data-state="spawning"] .state{color:var(--signal)}
.strip[data-state="thinking"]{animation:breathe 2s ease-in-out infinite}
.strip[data-state="blocked"]{border-left-color:var(--urgent);animation:jitter 3s ease-in-out infinite}
.strip[data-state="blocked"] .state{color:var(--urgent)}
.strip[data-state="ok"]{border-left-color:var(--verified);opacity:.72;background:transparent}
.strip[data-state="ok"] .state{color:var(--verified)}
.strip[data-state="ok"] .trace i{opacity:.18}
.strip[data-state="failed"]{border-left-color:var(--fault);animation:shake .3s ease-in-out 1}
.strip[data-state="failed"] .state{color:var(--fault)}
.strip[data-state="failed"] .trace i{background:var(--fault);opacity:.5}
/* Entry animation last: equal specificity to the state rules above, so a strip
   that arrives already-thinking slides in rather than breathing on frame one. */
.strip.enter{animation:slide-in .22s cubic-bezier(.2,.8,.2,1) both}

/* ── Findings ───────────────────────────────────────────────────────────── */
.finding{
  border-left:2px solid var(--rule);padding:9px 0 9px 13px;margin-bottom:9px;
}
.finding[data-sev="high"]{border-left-color:var(--urgent)}
.finding[data-sev="medium"]{border-left-color:var(--signal)}
.finding.enter{animation:slide-right .18s ease-out both}
.finding.enter[data-sev="high"]{animation:slide-right .18s ease-out both,flare .9s ease-out .18s}
.finding .top{display:flex;align-items:baseline;gap:9px;margin-bottom:4px}
.finding .sev{
  font-family:var(--display);font-weight:700;font-size:var(--fs-label);
  letter-spacing:.14em;text-transform:uppercase;
}
.finding[data-sev="high"] .sev{color:var(--urgent)}
.finding[data-sev="medium"] .sev{color:var(--signal)}
.finding[data-sev="low"] .sev{color:var(--dim)}
.finding .src{font-family:var(--data);font-size:var(--fs-label);color:var(--dim)}
.finding .conf{margin-left:auto;font-family:var(--data);font-size:var(--fs-label);color:var(--dim);font-variant-numeric:tabular-nums}
.finding .agree{
  font-family:var(--data);font-size:var(--fs-label);color:var(--signal);
  letter-spacing:.04em;flex:none;
}
.finding .agree:empty{display:none}
/* Confidence as a bar, not a number a projector eats. */
.finding .gauge{
  width:58px;height:4px;background:var(--rule);flex:none;position:relative;overflow:hidden;
}
.finding .gauge i{position:absolute;inset:0 auto 0 0;background:var(--dim);display:block}
.finding[data-sev="high"] .gauge i{background:var(--urgent)}
.finding.rejected .gauge i{background:var(--fault)}
.finding.amendment .gauge i{background:var(--verified)}
.finding.collapsed .gauge{display:none}
.finding .title{font-size:var(--fs-body);font-weight:500;line-height:1.3}
.finding .sum{
  font-size:var(--fs-data);color:var(--dim);line-height:1.4;margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.finding .ref{font-family:var(--data);font-size:var(--fs-label);color:var(--dim);opacity:.7;margin-top:3px}
.finding.rejected{opacity:.45}
.finding.rejected .title{text-decoration:line-through;text-decoration-color:var(--fault)}
.finding.rejected .sev{color:var(--fault)}
.finding.collapsed .sum,.finding.collapsed .ref{display:none}
.finding .amend{display:none}
/* The rejection and its amendment, pinned together at the top of the feed. A shared
   tint groups them; the amendment carries the connector and the verified border. */
.finding.pinned{background:rgba(255,92,92,.07);padding-right:11px}
.finding.pinned.amendment{background:rgba(78,210,160,.07);border-left-color:var(--verified)}
.finding.amendment .amend{
  display:block;font-family:var(--display);font-weight:600;font-size:var(--fs-label);
  letter-spacing:.14em;text-transform:uppercase;color:var(--verified);margin-bottom:5px;
}
.finding.amendment .sev{color:var(--verified)}
.finding.collapsed{padding-top:5px;padding-bottom:5px;margin-bottom:5px}

/* ── Bottom rail ────────────────────────────────────────────────────────── */
.foot{
  margin-top:18px;padding-top:14px;border-top:1px solid var(--rule);
  display:flex;align-items:center;gap:18px;min-height:58px;
}
#footmain{display:flex;align-items:center;gap:18px;flex:1;min-width:0}
#footnote{
  font-family:var(--data);font-size:var(--fs-label);flex:none;max-width:32%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim);
}
#footnote[data-level="warn"]{color:var(--signal)}
#footnote[data-level="error"]{color:var(--fault)}
.foot .tag{
  font-family:var(--display);font-weight:600;font-size:var(--fs-label);
  letter-spacing:.16em;text-transform:uppercase;color:var(--dim);flex:none;
}
.foot .headline{font-size:var(--fs-strip);font-family:var(--body);font-weight:500;line-height:1.25}
.foot .listening{font-family:var(--data);font-size:var(--fs-data);color:var(--signal)}
.bar{height:6px;flex:1;background:var(--rack);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--signal);transition:width .5s ease}

/* Idle scanline */
#scan{
  position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,transparent 0%,var(--signal) 50%,transparent 100%);
  mix-blend-mode:screen;
}
#scan.on{opacity:.08;animation:sweep 6s linear infinite}
#flash{position:fixed;inset:0;background:var(--signal);opacity:0;pointer-events:none}
#flash.on{animation:flash .5s ease-out}

/* Empty */
.empty{
  font-family:var(--display);font-weight:600;font-size:var(--fs-strip);
  letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:40px 0;
}
.empty small{display:block;font-family:var(--data);font-size:var(--fs-data);
  letter-spacing:0;text-transform:none;margin-top:10px;opacity:.7}

/* ── Motion ─────────────────────────────────────────────────────────────── */
@keyframes slide-in{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
@keyframes slide-right{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes breathe{0%,100%{border-left-color:var(--signal)}50%{border-left-color:#7A5510}}
@keyframes jitter{0%,100%{transform:translateX(0)}48%{transform:translateX(0)}50%{transform:translateX(1px)}52%{transform:translateX(-1px)}54%{transform:translateX(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes flare{from{background:rgba(255,138,61,.22)}to{background:transparent}}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes flash{0%{opacity:0}20%{opacity:.12}100%{opacity:0}}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  /* Beat 5 is the watch-trigger flash, and killing every animation killed it outright —
     #flash never left opacity:0, so the beat that sells always-on silently didn't fire.
     Hold a static tint instead; render() clears it on the next frame. */
  #flash.on{opacity:.12}
}
</style>
</head>
<body>
<div id="board">
  <div class="rail">
    <div class="mark">Glass<em>Box</em></div>
    <div class="mission" id="mission">no run loaded</div>
    <div class="clock" id="clock">00:00</div>
    <div class="live" id="live" data-mode="off"><span class="dot"></span><span id="livetext">standby</span></div>
  </div>

  <div class="counters" id="counters"></div>

  <div class="panes">
    <div class="pane">
      <h2>Rack</h2>
      <div class="scroll" id="rack"></div>
      <div id="scan"></div>
    </div>
    <div class="pane">
      <h2>Findings</h2>
      <div class="scroll" id="findings"></div>
    </div>
  </div>

  <div class="foot" id="foot"><div id="footmain"></div><div id="footnote"></div></div>
</div>
<div id="flash"></div>

<script>
"use strict";

/* ══ Config ═══════════════════════════════════════════════════════════════ */
const qs = new URLSearchParams(location.search);
const REPLAY = qs.get("replay");
const SPEED = Math.max(0.1, parseFloat(qs.get("speed")) || 1);   // NaN or 0 would blank the board
const SEED_MODE = qs.has("seed");
const HAS_FROM = qs.has("from");
const FROM = parseInt(qs.get("from") || "0", 10);   // replay seek: fold below this seq instantly
const LOG_URL = qs.get("log") || "runs/current/events.jsonl";
const POLL_MS = 250;
const TRACE_BARS = 30;
if (qs.has("big")) document.documentElement.classList.add("big");

/* ══ State — a pure fold over the event list ══════════════════════════════
   apply() must stay pure: no fetch, no Date.now(), no unseeded randomness.
   That purity is the only reason replay renders identically to live.        */

function initialState(){
  return {
    lastSeq:-1, mission:"", startTs:null, lastTs:null, runStatus:null,
    agents:new Map(),      // id -> {id,label,role,state,parent,findings,cost,trace[],order}
    order:0,
    findings:[],           // newest last
    verdicts:new Map(),    // finding_id -> {status, reason, attempt}
    retries:0, cost:0,
    retryOf:new Map(),     // of_agent_id -> {attempt, reason, budget_remaining}
    reduce:{active:false,pct:0,stage:"",headline:"",artifact:""},
    watch:{armed:false,path:"",triggers:0,lastTrigger:null},
    note:null,             // newest log.note — the schema's escape hatch, rendered in the foot
  };
}

function traceBar(ev){
  // Deterministic pseudo-height from the event — signal-looking, identical on replay.
  let h = 0;
  const s = ev.type + ":" + ev.seq;
  for (let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) & 0xffff;
  const base = {"finding.written":16,"agent.status":8,"verify.failed":22,"verify.passed":12}[ev.type] || 6;
  return Math.min(26, base + (h % 11));
}

function touch(st, id, ev){
  const a = st.agents.get(id);
  if (!a) return;
  a.trace = a.trace.concat(traceBar(ev)).slice(-TRACE_BARS);
}

function apply(st, ev){
  if (ev.v !== 1) return st;
  st.lastSeq = ev.seq;
  st.lastTs = ev.ts;
  if (st.startTs === null) st.startTs = ev.ts;
  const p = ev.payload || {};

  switch(ev.type){
    case "run.started":
      st.mission = p.mission || st.mission;
      st.runStatus = "running";
      break;

    case "run.finished":
      st.runStatus = p.status || "ok";
      break;

    case "agent.spawned":
      st.agents.set(ev.agent_id, {
        id: ev.agent_id, label: p.label || ev.agent_id, role: p.role || "worker",
        model: p.model || "", state: "spawning", parent: ev.parent_id || null,
        findings: 0, cost: 0, trace: [], order: st.order++,
      });
      touch(st, ev.agent_id, ev);
      break;

    case "agent.status": {
      const a = st.agents.get(ev.agent_id);
      if (a){ a.state = p.state || a.state; a.note = p.note || ""; }
      touch(st, ev.agent_id, ev);
      break;
    }

    case "agent.done": {
      const a = st.agents.get(ev.agent_id);
      if (a){
        a.state = p.status === "failed" ? "failed" : "ok";
        // Coerce both: a JSON string would concatenate, and .toFixed() then throws out
        // of the render — which in replay kills the rAF chain permanently.
        a.cost = Number(p.cost_usd) || 0;
        st.cost += a.cost;
      }
      touch(st, ev.agent_id, ev);
      break;
    }

    case "finding.written": {
      const a = st.agents.get(ev.agent_id);
      if (a) a.findings++;
      st.findings.push({
        // Fall back to seq: without an id every id-less finding collapses onto one
        // DOM node, and one verdict keyed on undefined would apply to all of them.
        id: p.finding_id ?? ("seq:" + ev.seq), agent: ev.agent_id, title: p.title || "",
        severity: p.severity || "low", confidence: p.confidence,
        summary: p.summary || "", ref: p.evidence_ref || "", seq: ev.seq,
      });
      touch(st, ev.agent_id, ev);
      break;
    }

    case "verify.passed":
      st.verdicts.set(p.finding_id, {status:"passed", attempt:p.attempt});
      touch(st, ev.agent_id, ev);
      break;

    case "verify.failed":
      st.verdicts.set(p.finding_id, {status:"failed", attempt:p.attempt, reason:p.reason||""});
      touch(st, ev.agent_id, ev);
      break;

    case "agent.retry":
      st.retries++;
      // Keep the payload. 05 Beat 3 narrates the budget cap "even though it's on
      // screen"; discarding budget_remaining is what made that untrue.
      st.retryOf.set(p.of_agent_id, {
        attempt: p.attempt, reason: p.reason || "",
        budget: p.budget_remaining,
      });
      break;

    case "log.note":
      st.note = {level: p.level || "info", message: p.message || "", agent: ev.agent_id};
      touch(st, ev.agent_id, ev);
      break;

    case "reduce.started":
      st.reduce = {...st.reduce, active:true, pct:8, stage:"starting"};
      touch(st, ev.agent_id, ev);
      break;

    case "reduce.progress":
      st.reduce = {...st.reduce, active:true, pct:p.pct||st.reduce.pct, stage:p.stage||""};
      touch(st, ev.agent_id, ev);
      break;

    case "reduce.finished":
      st.reduce = {active:false, pct:100, stage:"done",
                   headline:p.headline||"", artifact:p.artifact_path||""};
      touch(st, ev.agent_id, ev);
      break;

    case "watch.armed":
      st.watch = {...st.watch, armed:true, path:p.path||""};
      break;

    case "watch.triggered":
      st.watch = {...st.watch, triggered:true, triggers:st.watch.triggers+1, lastTrigger:p.path||""};
      break;
  }
  return st;
}

/* ══ Render ═══════════════════════════════════════════════════════════════
   The DOM is keyed by id and updated in place. Rebuilding innerHTML on every
   poll restarts every CSS animation on every event — the whole rack would
   slide in from the left four times a second, and the reduce bar could never
   transition. Create on first sight, mutate after that: entry animations then
   fire exactly once, when the thing actually arrives.                        */

const $ = (id) => document.getElementById(id);
const stripEls = new Map();      // agent_id  -> element
const findingEls = new Map();    // finding_id -> element
let footMode = null;
let flashedTriggers = 0;

function resetRender(){
  stripEls.clear(); findingEls.clear();
  footMode = null; flashedTriggers = 0;
  for (const id of ["rack","findings","footmain"]){ $(id).innerHTML = ""; delete $(id).dataset.empty; }
  $("footnote").textContent = "";
}

function onceThen(el, cls){
  el.classList.add(cls);
  el.addEventListener("animationend", () => el.classList.remove(cls), {once:true});
}

function fmtClock(st){
  if (!st.startTs || !st.lastTs) return "00:00";
  const ms = Date.parse(st.lastTs) - Date.parse(st.startTs);
  const s = Math.max(0, Math.floor(ms/1000));
  return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
}

function activeCount(st){
  let n = 0;
  for (const a of st.agents.values())
    if (a.state==="working"||a.state==="thinking"||a.state==="spawning"||a.state==="blocked") n++;
  return n;
}

function stateLabel(a){
  return {spawning:"spawn", thinking:"think", working:"work", waiting:"wait",
          blocked:"block", ok:"done", failed:"fail"}[a.state] || a.state;
}

function setText(el, sel, value){
  const t = el.querySelector(sel);
  if (t.textContent !== value) t.textContent = value;
}

function renderCounters(st, conv){
  const active = activeCount(st);
  const rejected = [...st.verdicts.values()].filter(v=>v.status==="failed").length;
  const items = [
    ["agents", st.agents.size, false],
    ["active", active, active>0],
    ["findings", st.findings.length, false],
    ["converged", conv.count, conv.count > 0],
    ["rejected", rejected, rejected>0],
    ["retries", st.retries, st.retries>0],
    ["cost", "$" + st.cost.toFixed(3), false],
    ["seq", st.lastSeq < 0 ? "—" : st.lastSeq, false],
  ];
  // No animations here, so a rebuild is free.
  $("counters").innerHTML = items.map(([k,v,hot]) =>
    `<div class="counter${hot?" hot":""}"><b>${v}</b><span>${k}</span></div>`).join("");
}

// Two agents citing the same file is the on-screen answer to "what did eight agents get
// you that one big call wouldn't" — eight isolated contexts, no shared memory, same
// conclusion. Derived from evidence_ref, so it needs no new events.
//
// Parent/child pairs must be excluded: a retry re-cites its parent's evidence by design,
// and counting it would draw a false convergence on the very finding that is already the
// rejection.
function convergences(st){
  const byRef = new Map();
  for (const f of st.findings){
    const file = String(f.ref || "").split(":")[0];
    if (!file) continue;
    if (!byRef.has(file)) byRef.set(file, new Set());
    byRef.get(file).add(f.agent);
  }
  const peers = new Map();      // agent id -> Set of agents that independently agreed
  let count = 0;
  for (const agents of byRef.values()){
    const ids = [...agents];
    const independent = ids.filter(a =>
      !ids.some(b => b !== a &&
        (st.agents.get(a)?.parent === b || st.agents.get(b)?.parent === a)));
    if (independent.length < 2) continue;
    count++;
    for (const a of independent){
      if (!peers.has(a)) peers.set(a, new Set());
      for (const b of independent) if (b !== a) peers.get(a).add(b);
    }
  }
  return {peers, count};
}

function rackRows(st){
  // Parents first, each followed by its children — that's the amended-strip visual.
  const all = [...st.agents.values()].sort((a,b)=>a.order-b.order);
  const rows = [];
  for (const r of all) if (!r.parent){
    rows.push([r,false]);
    for (const c of all) if (c.parent === r.id) rows.push([c,true]);
  }
  for (const a of all) if (a.parent && !st.agents.has(a.parent)) rows.push([a,false]);
  return rows;
}

function traceHTML(a){
  return a.trace.map((h,i)=>{
    const fromEnd = a.trace.length - 1 - i;
    const live = a.state!=="ok" && a.state!=="failed" && fromEnd < 3;
    const op = live ? 1 : Math.max(.18, .8 - fromEnd*0.035);
    const col = live ? "var(--signal)" : "var(--dim)";
    return `<i style="height:${h}px;background:${col};opacity:${op.toFixed(2)}"></i>`;
  }).join("");
}

function renderRack(st, conv){
  const rack = $("rack");
  if (st.agents.size === 0){
    if (!rack.dataset.empty){
      rack.dataset.empty = "1";
      rack.innerHTML = `<div class="empty">No run loaded<small>Start a run, or open ?replay=logs/golden.jsonl</small></div>`;
    }
    return;
  }
  if (rack.dataset.empty){ delete rack.dataset.empty; rack.innerHTML = ""; }

  rackRows(st).forEach(([a, child], i) => {
    let el = stripEls.get(a.id);
    if (!el){
      el = document.createElement("div");
      el.className = "strip";
      el.innerHTML = `<span class="id"></span><span class="label"></span>`
                   + `<span class="note"></span><span class="conv"></span>`
                   + `<span class="budget"></span><span class="trace"></span>`
                   + `<span class="state"></span><span class="meta"></span>`;
      el.querySelector(".id").textContent = a.id;
      stripEls.set(a.id, el);
      onceThen(el, "enter");
    }
    el.classList.toggle("child", child);
    if (el.dataset.state !== a.state) el.dataset.state = a.state;
    setText(el, ".label", a.label);
    // A retry child shows what it is an attempt at, and how many are left. Nesting says
    // what retried; this says how many more times it is allowed to.
    const r = a.parent ? st.retryOf.get(a.parent) : null;
    setText(el, ".budget", r ? `attempt ${(r.attempt ?? 1) + 1} · budget ${r.budget ?? 0}` : "");
    // agent.status carries a note on every event and none of it was rendered, so eight
    // strips all said WORK. This is the fan-out argument carried by the texture rather
    // than the narration — and it makes `blocked` explain itself.
    setText(el, ".note", a.note || "");
    const peers = conv.peers.get(a.id);
    setText(el, ".conv", peers ? [...peers].map(x => "⋈" + x).join(" ") : "");
    setText(el, ".state", stateLabel(a));
    setText(el, ".meta", `${a.findings} ▪ $${a.cost.toFixed(3)}`);
    el.querySelector(".trace").innerHTML = traceHTML(a);
    // insertBefore MOVES an existing node — it does not recreate it, so reordering
    // (a retry child appearing under its parent) costs no animation restart.
    if (rack.children[i] !== el) rack.insertBefore(el, rack.children[i] || null);
  });
}

function renderFindings(st, conv){
  const pane = $("findings");
  if (st.findings.length === 0){
    if (!pane.dataset.empty){
      pane.dataset.empty = "1";
      pane.innerHTML = `<div class="empty" style="font-size:var(--fs-data);letter-spacing:0;text-transform:none">Waiting for findings.</div>`;
    }
    return;
  }
  if (pane.dataset.empty){ delete pane.dataset.empty; pane.innerHTML = ""; }

  // Beat 3 is the rejection and the amendment that answers it. Left in feed order they
  // drift rows apart and the rejection eventually collapses, hiding the verifier's
  // reason — during the beat built around it. Pin the pair to the top, together, and
  // keep them expanded. The amendment is a finding filed by a child of the agent whose
  // finding was rejected, which parent_id already tells us.
  const contested = [];
  const pinnedIds = new Set();
  for (const r of st.findings){
    if (st.verdicts.get(r.id)?.status !== "failed") continue;
    const amend = st.findings.find(f => st.agents.get(f.agent)?.parent === r.agent);
    contested.push(r); pinnedIds.add(r.id);
    if (amend){ contested.push(amend); pinnedIds.add(amend.id); }
  }
  const list = contested.concat([...st.findings].reverse().filter(f => !pinnedIds.has(f.id)));

  list.forEach((f,i) => {
    let el = findingEls.get(f.id);
    if (!el){
      el = document.createElement("div");
      el.className = "finding";
      el.dataset.sev = f.severity;
      el.innerHTML = `<div class="amend"></div>`
                   + `<div class="top"><span class="sev"></span><span class="src"></span>`
                   + `<span class="agree"></span><span class="conf"></span>`
                   + `<span class="gauge"><i></i></span></div><div class="title"></div>`
                   + `<div class="sum"></div><div class="ref"></div>`;
      el.querySelector(".src").textContent = f.agent;
      el.querySelector(".conf").textContent =
        Number.isFinite(f.confidence) ? f.confidence.toFixed(2) : "";
      // Confidence was an 11px number in a corner doing no work. As a gauge it shows
      // that the rejected finding is the least-confident high in the run, and that its
      // amendment comes back better calibrated.
      el.querySelector(".gauge i").style.width =
        Number.isFinite(f.confidence) ? Math.round(f.confidence * 100) + "%" : "0%";
      el.querySelector(".title").textContent = f.title;
      el.querySelector(".ref").textContent = f.ref;
      findingEls.set(f.id, el);
      onceThen(el, "enter");
    }
    const v = st.verdicts.get(f.id);
    const rejected = !!(v && v.status === "failed");
    const isAmendment = pinnedIds.has(f.id) && !rejected;
    el.classList.toggle("pinned", pinnedIds.has(f.id));
    el.classList.toggle("amendment", isAmendment);
    setText(el, ".amend", isAmendment ? `↓ amended · attempt ${v?.attempt ?? 2}` : "");
    el.classList.toggle("rejected", rejected);
    el.classList.toggle("collapsed", i >= 5 && !pinnedIds.has(f.id));
    setText(el, ".sev", rejected ? "rejected" : f.severity);
    const peers = conv.peers.get(f.agent);
    setText(el, ".agree", peers ? [...peers].map(x => "⋈" + x).join(" ") : "");
    setText(el, ".sum", rejected ? (v.reason || "") : f.summary);
    if (pane.children[i] !== el) pane.insertBefore(el, pane.children[i] || null);
  });
}

const FOOT_TEMPLATES = {
  brief:   `<span class="tag">Brief</span><span class="headline"></span><span class="tag artifact"></span>`,
  reduce:  `<span class="tag">Reduce</span><span class="bar"><i></i></span><span class="tag stage"></span>`,
  watch:   `<span class="tag">Always on</span><span class="listening"></span>`,
  swarm:   `<span class="tag">Swarm</span><span class="bar"><i></i></span><span class="tag working"></span>`,
  standby: `<span class="tag">Standby</span>`,
};

function renderFoot(st){
  const main = $("footmain");
  const idle = activeCount(st) === 0;
  const mode = (st.reduce.headline && idle) ? "brief"
             : st.reduce.active               ? "reduce"
             : (idle && st.watch.armed)       ? "watch"
             : st.agents.size                 ? "swarm" : "standby";
  if (mode !== footMode){ footMode = mode; main.innerHTML = FOOT_TEMPLATES[mode]; }

  if (mode === "brief"){
    setText(main, ".headline", st.reduce.headline);
    setText(main, ".artifact", st.reduce.artifact);
  } else if (mode === "reduce"){
    main.querySelector(".bar i").style.width = st.reduce.pct + "%";   // transitions, now that the node persists
    setText(main, ".stage", st.reduce.stage);
  } else if (mode === "watch"){
    const n = st.watch.triggers;
    setText(main, ".listening", `listening · ${st.watch.path} · ${n} trigger${n===1?"":"s"} · armed`);
  } else if (mode === "swarm"){
    const done = st.agents.size - activeCount(st);
    main.querySelector(".bar i").style.width = Math.round(100*done/st.agents.size) + "%";
    setText(main, ".working", `${activeCount(st)} working`);
  }

  // log.note is the schema's escape hatch; it renders here in every mode.
  const note = $("footnote");
  const text = st.note ? `${st.note.agent} · ${st.note.message}` : "";
  if (note.textContent !== text) note.textContent = text;
  if (st.note) note.dataset.level = st.note.level; else delete note.dataset.level;
}

function render(st, mode){
  $("mission").textContent = st.mission || "no run loaded";
  $("clock").textContent = fmtClock(st);
  const conv = convergences(st);
  renderCounters(st, conv);
  renderRack(st, conv);
  renderFindings(st, conv);
  renderFoot(st);

  const idle = activeCount(st) === 0 && st.agents.size > 0;
  const live = $("live");
  live.dataset.mode = mode === "replay" ? "replay" : (idle && st.watch.armed ? "idle" : (st.agents.size ? "live" : "off"));
  $("livetext").textContent = mode === "replay" ? "replay"
    : (idle && st.watch.armed ? "listening" : (st.agents.size ? "live" : "standby"));
  $("scan").classList.toggle("on", idle && st.watch.armed);

  if (st.watch.triggers > flashedTriggers){
    flashedTriggers = st.watch.triggers;
    const f = $("flash");
    f.classList.remove("on"); void f.offsetWidth; f.classList.add("on");
    // Clear it explicitly: under prefers-reduced-motion there is no animation to end,
    // so the tint would otherwise wash the board permanently.
    setTimeout(() => f.classList.remove("on"), 600);
  }
}

function esc(s){
  return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

/* ══ Transport ════════════════════════════════════════════════════════════ */

function parseLines(text){
  const out = [];
  const lines = text.split("\n");
  // A trailing element with no newline after it may be a partial write — skip it.
  for (let i = 0; i < lines.length - 1; i++){
    const raw = lines[i].trim();
    if (!raw) continue;
    try {
      const ev = JSON.parse(raw);
      if (ev && ev.v === 1 && typeof ev.seq === "number") out.push(ev);
    } catch { /* half-written line; it'll be complete next poll */ }
  }
  return out;
}

async function runLive(){
  let st = initialState();
  let seen = new Set();
  let activeRun = null;
  let activeRunStart = -1;
  render(st, "live");
  setInterval(async () => {
    let text;
    try {
      const res = await fetch(LOG_URL + "?t=" + Date.now(), {cache:"no-store"});
      if (!res.ok) return;
      text = await res.text();
    } catch { return; }

    const parsed = parseLines(text);
    if (!parsed.length) return;

    // Find where the newest run begins. A restart shows up as seq stepping backwards:
    // a fresh EventLog also changes run_id, but a *pinned* run_id — which EventLog
    // accepts, and which 04's T+10 step encourages — keeps the id and only sends seq
    // back to 0. Testing the last line's seq is not enough, because on a quiet poll it
    // already equals lastSeq and the board would reset on every tick.
    let runStart = 0;
    for (let k = 1; k < parsed.length; k++) if (parsed[k].seq <= parsed[k - 1].seq) runStart = k;
    const current = parsed.slice(runStart);
    const runId = current[current.length - 1].run_id;

    // Without this the old seq dedupe discards the new run's events as already-seen and
    // grafts its later ones onto the old state — a board blending two runs while looking
    // perfectly healthy, which is worse than the freeze it replaced.
    if (runId !== activeRun || runStart !== activeRunStart){
      activeRun = runId; activeRunStart = runStart;
      st = initialState(); seen = new Set(); resetRender();
    }

    const fresh = current
      .filter(e => !seen.has(e.seq))
      .sort((a,b) => a.seq - b.seq);
    if (!fresh.length) return;
    for (const ev of fresh){ seen.add(ev.seq); st = apply(st, ev); }
    render(st, "live");
  }, POLL_MS);
}

async function runReplay(){
  let text;
  try {
    const res = await fetch(REPLAY + "?t=" + Date.now(), {cache:"no-store"});
    text = await res.text();
  } catch {
    $("rack").innerHTML = `<div class="empty">Log not found<small>${esc(REPLAY)}</small></div>`;
    return;
  }
  const events = parseLines(text).sort((a,b)=>a.seq-b.seq);
  if (!events.length){
    $("rack").innerHTML = `<div class="empty">Log is empty<small>${esc(REPLAY)}</small></div>`;
    return;
  }
  let st = initialState();

  // Seek first, so ?seed=1 and ?from= compose. Everything below ?from= is folded
  // instantly and the rest animates from there — that is what makes "the live run
  // died, switch to the replay tab and pick up at the same beat" possible, and it
  // is also how you screenshot a specific beat rather than the final frame.
  let i = 0;
  while (i < events.length && events[i].seq < FROM) st = apply(st, events[i++]);

  if (SEED_MODE){                       // instant, no animation — for screenshots
    // With ?from= this is a still of that beat, so stop at the seek point. Without it,
    // fold everything and show the final frame.
    if (!HAS_FROM) for (; i < events.length; i++) st = apply(st, events[i]);
    render(st, "replay");
    return;
  }
  if (i >= events.length){ render(st, "replay"); return; }

  const t0 = Date.parse(events[i].ts);
  const started = performance.now();
  render(st, "replay");

  function step(){
    // Guarded: a throw here used to escape before the trailing requestAnimationFrame,
    // killing the chain for good. One malformed event should cost one frame, not the
    // rest of the demo.
    try {
      const virtual = (performance.now() - started) * SPEED;
      let advanced = false;
      while (i < events.length && (Date.parse(events[i].ts) - t0) <= virtual){
        st = apply(st, events[i++]); advanced = true;
      }
      if (advanced) render(st, "replay");
    } catch (err) {
      console.error("render step failed", err);
    }
    if (i < events.length) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

if (REPLAY) runReplay(); else runLive();
</script>
